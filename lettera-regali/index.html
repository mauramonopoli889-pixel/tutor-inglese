<title>Lettera dei Desideri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: un iPhone sempre visibile al centro su una notte di Natale; dentro, un'app in vetro smerigliato rosso, verde e oro, guidata in 3 passi. Un solo look, valido in ogni tema. */
:root{
  --red:#9b1c2e; --wine:#5c0f1c; --green:#0f4a35; --pine:#0a2e22; --gold:#e8c36a; --cream:#fff8ec;
  --ink:#22171a; --muted:rgba(34,23,26,.55); --white:#ffffff; --wmuted:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.14); --glass2:rgba(255,255,255,.26); --stroke:rgba(255,255,255,.32);
  --ui:"Urbanist",-apple-system,"SF Pro Display",system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--white);background:#3a0a14;overflow:hidden;
  background-image:radial-gradient(40% 35% at 18% 18%,rgba(232,195,106,.35),transparent 70%),radial-gradient(45% 40% at 85% 25%,#1d6b4d,transparent 70%),
  radial-gradient(50% 45% at 12% 88%,#a3233a,transparent 70%),radial-gradient(45% 45% at 92% 92%,#0f4a35,transparent 70%),linear-gradient(160deg,#6d1222,#2a0710)}
.snow{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 120px 90px,#fff,transparent),radial-gradient(1.5px 1.5px at 200px 160px,#fff,transparent),radial-gradient(2px 2px at 60px 200px,#fff,transparent),radial-gradient(1.5px 1.5px at 260px 40px,#fff,transparent);
  background-size:300px 240px;animation:snow 18s linear infinite}
@keyframes snow{to{background-position:0 240px}}
.stage{height:100%;display:grid;place-items:center;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.o1{width:230px;height:230px;left:7%;top:12%;background:radial-gradient(circle at 35% 30%,#fff 0,#f0a0aa 18%,#c0283f 55%,#6d0f1e 100%);box-shadow:0 30px 60px -20px #000}
.o2{width:160px;height:160px;right:9%;bottom:10%;background:radial-gradient(circle at 35% 30%,#fff 0,#f6dc9a 18%,#d4a43a 55%,#7a5512 100%);box-shadow:0 30px 60px -20px #000}
.o3{width:90px;height:90px;right:20%;top:14%;background:radial-gradient(circle at 35% 30%,#fff 0,#9ad7b9 18%,#1d7a55 55%,#0a3325 100%)}

/* Telefono */
.phone{position:relative;width:390px;height:812px;border-radius:58px;padding:12px;flex:none;
  background:linear-gradient(145deg,#f3e6cf,#b89a62);box-shadow:0 40px 80px -30px rgba(0,0,0,.7),inset 0 0 0 2px rgba(255,255,255,.6)}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;
  background:linear-gradient(175deg,#a8213a 0%,#7a1426 38%,#3a1a1d 62%,#0f4a35 100%)}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(55% 28% at 85% 18%,rgba(232,195,106,.38),transparent 70%),radial-gradient(50% 30% at 5% 55%,rgba(255,120,140,.25),transparent 70%)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:50}
.status{position:absolute;top:0;left:0;right:0;height:58px;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0 44px;font-weight:700;font-size:16px;z-index:40;
  background:linear-gradient(#a8213a 55%,rgba(168,33,58,0))}
.bat{width:26px;height:12px;border-radius:4px;border:1.5px solid #fff;padding:1.5px;display:inline-block;vertical-align:middle}.bat i{display:block;height:100%;width:80%;background:#fff;border-radius:2px}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;opacity:.85;z-index:50}
.view{position:absolute;inset:0;overflow-y:auto;padding:60px 18px 130px;scrollbar-width:none;animation:in .35s ease-out}
.view::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Passi */
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps button{flex:1;border:1px solid var(--stroke);background:var(--glass);color:var(--wmuted);border-radius:99px;padding:7px 4px;font:700 12px var(--ui);cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.steps b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:11px}
.steps .on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.steps .on b{background:var(--ink);color:var(--gold)}
.steps .ok b{background:var(--green)}
.hint{display:flex;gap:10px;align-items:center;border-radius:18px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin-bottom:14px}
.hint span{font-size:22px}

/* Componenti */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;cursor:pointer;border:1px solid var(--stroke);background:var(--glass2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.title{font-size:44px;font-weight:700;line-height:.98;letter-spacing:-.03em;margin:12px 0 14px;text-shadow:0 0 22px rgba(255,220,160,.45);text-wrap:balance}
.soft{filter:blur(1.2px);opacity:.85;color:var(--gold)}
.count{display:flex;align-items:center;gap:14px;border-radius:24px;padding:14px 16px;margin-bottom:14px;background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.count .n{font-size:44px;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.count .t{font-size:14px;line-height:1.3;font-weight:600}
.count .t small{display:block;color:var(--wmuted);font-weight:500}
.count.late{background:rgba(255,80,80,.22);border-color:rgba(255,140,140,.6)}
.count.late .n{color:#ffb4b4}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:99px;padding:9px 16px;font:600 14px var(--ui);color:#fff;cursor:pointer;background:var(--glass);border:1px solid var(--stroke)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-auto-flow:dense}
.tile{border-radius:24px;overflow:hidden;position:relative;cursor:pointer;border:1px solid var(--stroke);padding:0;text-align:left;font-family:var(--ui);color:var(--ink);min-height:160px;display:block;width:100%;background:#fff}
.tile.tall{grid-row:span 2;min-height:332px}
.tile.wide{grid-column:span 2}
.tile .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.tile .emo{position:absolute;right:12px;top:10px;font-size:46px}
.tile .cap{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;padding:9px 11px;border-radius:16px;
  background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tile .nm{font-weight:800;font-size:15px;line-height:1.1}
.br{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.price{font-size:12px;font-weight:800;color:var(--red)}
.tap{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:14px;color:var(--ink)}
.tile.chosen{box-shadow:0 0 0 3px var(--gold)}
.flag{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}

/* Pagine */
.dtitle{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.03em;text-align:center;margin:16px 0 12px;text-shadow:0 0 22px rgba(255,220,160,.45);text-wrap:balance}
.stack{position:relative;margin-top:22px}
.stack::before,.stack::after{content:"";position:absolute;left:24px;right:24px;top:-18px;height:40px;border-radius:22px;background:rgba(255,255,255,.3)}
.stack::after{left:12px;right:12px;top:-9px;background:#f4dfa8}
.paper{position:relative;z-index:1;background:var(--cream);color:var(--ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
.paper .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.paper .hd b{font-size:16px}.paper .hd small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pen{width:36px;height:36px;border-radius:50%;background:#f1e6d3;display:grid;place-items:center;font-size:15px;flex:none}
.lead{font-size:21px;font-weight:800;color:var(--red);line-height:1.2;margin:0}
.body{font-size:15px;line-height:1.5;margin:0}
.hand{font-family:var(--hand);font-size:24px;line-height:1.22;margin:0}
.hand b{color:var(--red)}
.sig{font-family:var(--hand);font-size:34px;text-align:right;color:var(--red);margin:0}
.stamp{flex:none;width:78px;height:92px;border:2px dashed var(--red);border-radius:6px;transform:rotate(5deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;position:relative}
.stamp .tree{font-size:22px}
.stamp s{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-decoration-color:var(--red);text-decoration-thickness:2px}
.stamp i{font-family:var(--hand);font-style:normal;font-size:20px;color:var(--red);transform:rotate(-8deg);line-height:1}
.imgs{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.imgs div{aspect-ratio:1/1;max-width:100%;border-radius:18px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:56px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{font:700 13px var(--ui);text-decoration:none;color:var(--ink);background:#f1e6d3;border-radius:99px;padding:9px 13px}

.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;z-index:45;display:flex;gap:8px;padding:7px;border-radius:99px;background:rgba(20,10,12,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.fab button{border:0;border-radius:99px;font:800 16px var(--ui);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.fab .main{background:var(--gold);color:var(--ink);padding:15px 24px}
.fab .sec{background:rgba(255,255,255,.16);color:#fff;padding:15px 18px}
.fab .main.on{background:#2f9e6e;color:#fff}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(232,195,106,.25)}}
canvas#conf{position:absolute;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="stage" id="stage">
  <div class="snow"></div>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="phone" id="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span>ᯤ <span class="bat"><i></i></span></span></div>
      <div id="view"></div>
      <div class="fab" id="fab"></div>
      <canvas id="conf" hidden></canvas>
      <div class="home-ind"></div>
    </div>
  </div>
</div>

function countdown(){
  const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const xmas=new Date(now.getFullYear(),11,25),diff=Math.round((xmas-d0)/864e5);
  if(diff>1)return `<div class="count"><span class="n">${diff}</span><span class="t">giorni a Natale 🎄<small>Hai ancora tempo, ma non troppo.</small></span></div>`;
  if(diff===1)return `<div class="count"><span class="n">1</span><span class="t">giorno a Natale 🎄<small>È la vigilia: corri!</small></span></div>`;
  if(diff===0)return `<div class="count"><span class="n">0</span><span class="t">È Natale! 🎁<small>Spero che il regalo sia sotto l'albero.</small></span></div>`;
  const late=-diff;return `<div class="count late"><span class="n">+${late}</span><span class="t">${late===1?"giorno":"giorni"} di ritardo 😤<small>Babbo, il regalo doveva arrivare il 25!</small></span></div>`;
}
function steps(n){const L=["Leggi","Scegli","Conferma"],T=["letter","home","choice"];
  return `<div class="steps">${L.map((l,i)=>`<button data-step="${T[i]}" class="${i+1===n?"on":i+1<n?"ok":""}"><b>${i+1<n?"✓":i+1}</b>${l}</button>`).join("")}</div>`}
function wireSteps(){V.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>show(b.dataset.step))}
function show(v,extra){Object.assign(st,{view:v},extra||{});render();V.scrollTop=0}
function render(){({home,letter,item,choice})[st.view]();wireSteps()}

function letter(){
  V.innerHTML=`<div class="view">${steps(1)}
    <h1 class="dtitle">Caro Babbo <span class="soft">Natale</span></h1>
    ${countdown()}
    <div class="stack"><div class="paper">
      <div class="hd"><div><b>Lettera di Maura</b><small>Roma, ${today}</small></div>
        <div class="stamp" aria-label="Francobollo: Polo Nord cancellato, Roma Nord"><span class="tree">🎄</span><s>Polo Nord</s><i>Roma Nord</i></div></div>
      <p class="lead">Portami gioia.</p>
      <p class="hand" style="font-size:30px;color:var(--red)">Caro Babbo Natale,</p>${LETTER}</div></div></div>`;
  FAB.innerHTML=`<button class="main pulse" id="fs">Avanti: scegli il regalo →</button>`;
  document.getElementById("fs").onclick=()=>show("home");
}
function home(){
  const list=P.filter(p=>st.f==="all"||(st.f[0]==="b"&&p.b==+st.f[1])||(st.f.startsWith("c:")&&p.cat===st.f.slice(2)));
  V.innerHTML=`<div class="view">${steps(2)}
    <h1 class="title">I desideri <span class="soft">di Maura</span></h1>
    <div class="hint"><span>👆</span>Tocca un regalo per vederlo. Usa i filtri per budget o categoria.</div>
    <div class="chips" role="group" aria-label="Filtri">${FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${st.f===k}">${esc(l)}</button>`).join("")}</div>
    <div class="bento">${list.map(p=>`<button class="tile ${SIZE[p.id]||""} ${st.chosen===p.id?"chosen":""}" data-id="${p.id}">
        <div class="bg" style="${bg(p)}"></div>${p.img?"":`<span class="emo">${p.ic}</span>`}
        ${st.chosen===p.id?'<span class="flag">★ Scelto</span>':'<span class="tap">›</span>'}
        <div class="cap"><span class="br">${esc(p.brand)}</span><span class="nm">${esc(p.name)}</span><span class="price">${esc(p.price)}</span></div></button>`).join("")}</div></div>`;
  V.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.f=b.dataset.f;render()});
  V.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>show("item",{item:b.dataset.id}));
  FAB.innerHTML=`<button class="sec" id="fl">← Lettera</button>${st.chosen?`<button class="main" id="fc">Vedi la scelta 🎁</button>`:""}`;
  document.getElementById("fl").onclick=()=>show("letter");
  const fc=document.getElementById("fc");if(fc)fc.onclick=()=>show("choice");
}
function item(){
  const p=byId(st.item),is=st.chosen===p.id,w=p.name.split(" ");
  const other=P.filter(x=>x.cat===p.cat&&x.id!==p.id)[0];
  V.innerHTML=`<div class="view">${steps(2)}
    <div class="topbar"><button class="round" id="back" aria-label="Torna ai desideri">‹</button><span class="chip">${esc(p.price)}</span></div>
    <h1 class="dtitle">${esc(w.slice(0,-1).join(" ")||w[0])} <span class="soft">${w.length>1?esc(w[w.length-1]):""}</span></h1>
    <div class="stack"><div class="paper">
      <div class="hd"><div><b>${esc(p.brand)}</b><small>${esc(p.cat)} · ${esc(BUD.find(b=>b[0]===p.b)[2])}</small></div><span class="pen">♡</span></div>
      <div class="imgs"><div style="${bg(p)}">${p.img?"":p.ic}</div>${other?`<div style="${bg(other)};cursor:pointer" data-o="${other.id}" title="Vedi ${esc(other.name)}">${other.img?"":other.ic}</div>`:`<div style="background:linear-gradient(135deg,#f4dfa8,#9b1c2e)">✨</div>`}</div>
      <p class="hand">${esc(p.n)}</p>
      ${p.links.length?`<div class="links">${p.links.map(l=>`<a class="lnk" href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join("")}</div>`:""}
    </div></div></div>`;
  document.getElementById("back").onclick=()=>show("home");
  const o=V.querySelector("[data-o]");if(o)o.onclick=()=>show("item",{item:o.dataset.o});
  FAB.innerHTML=`<button class="sec" id="b2">‹</button><button class="main ${is?"on":"pulse"}" id="pick">${is?"✓ Già scelto":"🎁 Scelgo questo"}</button>`;
  document.getElementById("b2").onclick=()=>show("home");
  document.getElementById("pick").onclick=()=>{st.chosen=p.id;try{localStorage.setItem("lettera-scelta",p.id)}catch(e){}show("choice");confetti()};
}
function choice(){
  const p=st.chosen&&byId(st.chosen);
  if(!p){V.innerHTML=`<div class="view">${steps(3)}<h1 class="dtitle">Nessuna <span class="soft">scelta</span></h1>
    <div class="stack"><div class="paper"><p class="lead">Ancora niente.</p><p class="body">Torna ai desideri, tocca un regalo e premi "Scelgo questo".</p></div></div></div>`;
    FAB.innerHTML=`<button class="main pulse" id="fs">← Scegli un regalo</button>`;document.getElementById("fs").onclick=()=>show("home");return}
  const msg=`Cara Maura,\nho letto la tua letterina e ho scelto:\n🎁 ${p.brand} – ${p.name}${p.links[0]?"\n"+p.links[0][1]:""}\nBabbo Natale`;
  V.innerHTML=`<div class="view">${steps(3)}
    <h1 class="dtitle">Gioia <span class="soft">consegnata</span></h1>
    ${countdown()}
    <div class="stack"><div class="paper">
      <div class="hd"><div><b>La scelta di Babbo Natale</b><small>${today}</small></div><span class="pen">🎁</span></div>
      <div class="imgs" style="grid-template-columns:1fr"><div style="${bg(p)};aspect-ratio:4/3">${p.img?"":p.ic}</div></div>
      <p class="lead">${esc(p.brand)} · ${esc(p.name)}</p>
      <p class="body">Ultimo passo: copia il messaggio e mandalo a Maura.</p>
      <p class="body" id="msg" style="white-space:pre-wrap;background:#f1e6d3;border-radius:16px;padding:12px;user-select:all">${esc(msg)}</p>
    </div></div></div>`;
  FAB.innerHTML=`<button class="sec" id="chg">Cambia</button><button class="main pulse" id="copy">Copia per Maura</button>`;
  document.getElementById("chg").onclick=()=>show("home");
  document.getElementById("copy").onclick=async e=>{const b=e.currentTarget;b.classList.remove("pulse");try{await navigator.clipboard.writeText(msg);b.textContent="Copiato ✓"}
    catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("msg"));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent="Selezionato"}};
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("conf"),x=c.getContext("2d");c.hidden=false;c.width=c.offsetWidth;c.height=c.offsetHeight;
  const cols=["#e8c36a","#c0283f","#1d7a55","#ffffff"];
  const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,vy:2+Math.random()*3,vx:-1+Math.random()*2,a:Math.random()*6,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
    if(++t<200)requestAnimationFrame(f);else c.hidden=true})();
}
function fit(){const s=document.getElementById("stage"),ph=document.getElementById("phone");
  ph.style.zoom=Math.min(1,(s.clientWidth-24)/390,(s.clientHeight-24)/812)}
addEventListener("resize",fit);fit();
render();
</script>
