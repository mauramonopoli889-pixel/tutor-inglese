<title>Lettera dei Desideri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: un'app iOS a schermate (busta → lettera → vetrina dei sogni → scheda prodotto → scelta), con tab bar in basso */
:root{
  --bg:#f4efec; --card:#ffffff; --paper:#fffaf3; --line:#eadfd6; --ink:#2a2220; --muted:#8c7f78;
  --accent:#c23b4a; --gold:#b98a3e; --chip:#f5e9e5; --envelope:#d9474f;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --ui:"Nunito Sans",-apple-system,"SF Pro Text",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121012; --card:#1f1a1c; --paper:#241e1d; --line:#3a3032; --ink:#f4ece7; --muted:#a8999a;
  --accent:#f06b77; --gold:#e3b86c; --chip:#33292b; --envelope:#a8323a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121012; --card:#1f1a1c; --paper:#241e1d; --line:#3a3032; --ink:#f4ece7; --muted:#a8999a;
  --accent:#f06b77; --gold:#e3b86c; --chip:#33292b; --envelope:#a8323a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;margin:0}
.wrap{max-width:460px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 110px}
.screen{display:flex;flex-direction:column;gap:16px;animation:fade .35s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px;color:var(--accent);font-weight:700}
.top button{background:none;border:0;color:var(--accent);font:700 16px var(--ui);cursor:pointer;padding:6px 0}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}

/* Busta */
.env{margin:30px auto 0;width:100%;max-width:340px;aspect-ratio:4/3;position:relative;border-radius:14px;background:var(--envelope);
  box-shadow:0 22px 40px -20px rgba(0,0,0,.5);cursor:pointer;border:0;padding:0;overflow:hidden}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,rgba(0,0,0,.12) 50%) left/50% 100% no-repeat,
  linear-gradient(to bottom left,transparent 49.5%,rgba(0,0,0,.12) 50%) right/50% 100% no-repeat}
.env::after{content:"";position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(to bottom,rgba(255,255,255,.14),rgba(0,0,0,.08));
  clip-path:polygon(0 0,100% 0,50% 100%)}
.seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--gold);z-index:2;
  display:grid;place-items:center;font-family:var(--hand);font-size:30px;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.env-to{text-align:center;font-family:var(--hand);font-size:30px;margin:6px 0 0}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08)}}

/* Lettera */
.letter{background:var(--paper);border-radius:22px;padding:24px 20px 20px 22px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);background-position:0 72px;
  box-shadow:0 14px 34px -22px rgba(0,0,0,.45)}
.letter::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1px;background:var(--accent);opacity:.25}
.stamp{position:absolute;top:14px;right:14px;width:56px;height:66px;border:2px dashed var(--gold);border-radius:6px;display:grid;place-items:center;
  font-family:var(--hand);color:var(--gold);font-size:19px;line-height:.9;text-align:center;transform:rotate(6deg)}
.hand{font-family:var(--hand);font-size:25px;line-height:34px;margin:0;padding-left:20px}
.hand.h{font-size:32px;font-weight:700;color:var(--accent);margin-bottom:4px}
.hand.big{font-size:28px;color:var(--accent)}
.sig{text-align:right}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:800 17px var(--ui);cursor:pointer;text-align:center;text-decoration:none}
.cta.p{background:var(--accent);color:#fff}
.cta.s{background:var(--chip);color:var(--ink)}

/* Vetrina */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips button{flex:none;border:0;border-radius:99px;padding:8px 14px;background:var(--card);color:var(--ink);font:700 14px var(--ui);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:18px;overflow:hidden;border:0;padding:0;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;
  box-shadow:0 8px 20px -16px rgba(0,0,0,.5);position:relative;font-family:var(--ui)}
.card.chosen{outline:3px solid var(--accent)}
.ph{aspect-ratio:1/1;width:100%;max-width:100%;display:grid;place-items:center;font-size:58px;background-size:cover;background-position:center}
.ph.big{aspect-ratio:4/4.2;border-radius:24px;font-size:110px}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.brand{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.name{font-weight:800;font-size:15px;line-height:1.2}
.price{font-weight:800;font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums}
.badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-weight:800;font-size:12px;border-radius:99px;padding:4px 9px}
.dream{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:11px;border-radius:99px;padding:4px 8px}

/* Dettaglio */
.detail-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.note{font-family:var(--hand);font-size:25px;line-height:1.25;margin:0;background:var(--paper);border-radius:16px;padding:14px 16px}
.row{display:flex;flex-direction:column;gap:10px}

/* Scelta */
.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done .ph.big{width:220px}
.msg{background:var(--card);border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.45;white-space:pre-wrap;text-align:left;width:100%;user-select:all}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{display:flex;max-width:460px;width:100%;justify-content:space-around}
.tabs button{background:none;border:0;color:var(--muted);font:700 11px var(--ui);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 10px}
.tabs button span{font-size:22px;filter:grayscale(1);opacity:.7}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"] span{filter:none;opacity:1}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden><div>
  <button data-go="letter"><span>✉️</span>Lettera</button>
  <button data-go="shop"><span>✨</span>Sogni</button>
  <button data-go="choice"><span>🎁</span>La scelta</button>
</div></nav>
<canvas id="conf" hidden></canvas>

    </article>
    <button class="cta p" id="next">Guarda i miei sogni ✨</button></div>`;
  document.getElementById("next").onclick=()=>go("shop");
}
function shop(){
  const list=P.filter(p=>st.cat==="Tutti"||p.cat===st.cat);
  app.innerHTML=`<div class="screen">
    <div><h1>I miei sogni</h1><p class="sub">${P.length} desideri. Tocca una foto e scegline uno.</p></div>
    <div class="chips" role="group" aria-label="Categorie">${CATS.map(c=>`<button data-c="${esc(c)}" aria-pressed="${c===st.cat}">${esc(c)}</button>`).join("")}</div>
    <div class="grid">${list.map(p=>`<button class="card${st.chosen===p.id?" chosen":""}" data-id="${p.id}">
      ${ph(p)}<span class="dream">${stars(p.dream)}</span>${st.chosen===p.id?'<span class="badge">Scelto</span>':""}
      <span class="meta"><span class="brand">${esc(p.brand)}</span><span class="name">${esc(p.name)}</span><span class="price">${eur(p.price)}</span></span></button>`).join("")}</div>
    <p class="sub" style="text-align:center">✨ piccolo sogno · ✨✨ sogno · ✨✨✨ sogno grande</p></div>`;
  app.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;render()});
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>go("detail",{item:b.dataset.id}));
}
function detail(){
  const p=$(st.item),is=st.chosen===p.id;
  app.innerHTML=`<div class="screen">
    <div class="top"><button id="back">‹ Sogni</button><span>${stars(p.dream)}</span></div>
    ${ph(p,true)}
    <div class="detail-meta"><div><p class="brand" style="margin:0">${esc(p.brand)}</p><h1>${esc(p.name)}</h1></div><span class="price" style="font-size:20px;padding-top:18px">${eur(p.price)}</span></div>
    <p class="note">${esc(p.n)}</p>
    <div class="row">
      <button class="cta p" id="pick">${is?"✓ È questo il regalo scelto":"Scelgo questo 🎁"}</button>
      <a class="cta s" href="${p.u}" target="_blank" rel="noopener">Vedi nel negozio ↗</a>
    </div></div>`;
  document.getElementById("back").onclick=()=>go("shop");
  document.getElementById("pick").onclick=()=>{st.chosen=p.id;try{localStorage.setItem("lettera-scelta",p.id)}catch(e){}go("choice");confetti()};
}
function choice(){
  if(!st.chosen){app.innerHTML=`<div class="screen done" style="padding-top:40px">
    <div class="ph big" style="background:var(--chip);width:180px">🎁</div>
    <h1>Ancora nessuna scelta</h1><p class="sub">Guarda i sogni e scegline uno solo.</p>
    <button class="cta p" id="g">Vai ai sogni ✨</button></div>`;
    document.getElementById("g").onclick=()=>go("shop");return}
  const p=$(st.chosen);
  const msg=`Caro Babbo Natale di M.,\nho letto la tua letterina e ho scelto:\n🎁 ${p.brand} – ${p.name}\n${p.u}`;
  app.innerHTML=`<div class="screen done">
    <p class="sub" style="margin-top:20px">Il regalo scelto</p>
    ${ph(p,true)}
    <div><p class="brand" style="margin:0">${esc(p.brand)}</p><h1>${esc(p.name)}</h1></div>
    <p class="hand" style="padding:0;font-size:28px">Grazie Babbo, sei il migliore ♡</p>
    <div class="msg" id="msg">${esc(msg)}</div>
    <button class="cta p" id="copy">Copia il messaggio per M.</button>
    <button class="cta s" id="change">Cambia scelta</button></div>`;
  document.getElementById("copy").onclick=async e=>{try{await navigator.clipboard.writeText(msg);e.target.textContent="Copiato ✓ Ora incollalo in chat"}
    catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("msg"));getSelection().removeAllRanges();getSelection().addRange(r);e.target.textContent="Testo selezionato: copialo a mano"}};
  document.getElementById("change").onclick=()=>go("shop");
}
tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.go));

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("conf"),x=c.getContext("2d");c.hidden=false;
  c.width=innerWidth;c.height=innerHeight;
  const cols=["#c23b4a","#b98a3e","#f3b5c0","#7fb7a4","#ffd98a"];
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,
    vy:2+Math.random()*3,vx:-1+Math.random()*2,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;
    x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
    if(++t<200)requestAnimationFrame(f);else c.hidden=true})();
}
render();
</script>
