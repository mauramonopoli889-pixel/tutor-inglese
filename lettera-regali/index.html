<title>Lettera dei Desideri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: app iOS in vetro smerigliato su sfondo sfumato; lettera → sogni (categorie / budget) → scheda → la scelta. Un solo look, valido in ogni tema. */
:root{
  --g1:#ffd3c4; --g2:#f4a6c8; --g3:#b9a6f2; --g4:#9fd0f0;
  --ink:#241b2b; --muted:rgba(36,27,43,.62);
  --glass:rgba(255,255,255,.42); --glass-hi:rgba(255,255,255,.66); --stroke:rgba(255,255,255,.6);
  --accent:#d6336c; --on-accent:#ffffff;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --ui:"Nunito Sans",-apple-system,"SF Pro Text",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--ui);font-size:16px;background:#f3c6d4;
  background-image:radial-gradient(60% 50% at 10% 0%,var(--g1),transparent 70%),radial-gradient(55% 45% at 100% 20%,var(--g3),transparent 70%),
  radial-gradient(60% 50% at 0% 80%,var(--g4),transparent 70%),radial-gradient(60% 50% at 100% 100%,var(--g2),transparent 70%);
  background-attachment:fixed}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
.screen{display:flex;flex-direction:column;gap:16px;animation:in .35s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--stroke);border-radius:24px;box-shadow:0 10px 30px -18px rgba(60,20,60,.45)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);margin:0}
h1{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:15px}

/* Lettera */
.letter{padding:24px 22px 22px}
.hand{font-family:var(--hand);font-size:25px;line-height:1.28;margin:0 0 12px}
.hand.h{font-size:34px;font-weight:700;color:var(--accent)}
.hand.sig{text-align:right;font-size:32px;font-weight:700;margin:6px 0 0}
.hand b{color:var(--accent);font-weight:700}
.cta{display:block;width:100%;border:0;border-radius:18px;padding:16px;font:800 17px var(--ui);cursor:pointer;text-align:center;text-decoration:none;color:var(--ink)}
.cta.p{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 24px -12px var(--accent)}
.cta.s{background:var(--glass-hi);border:1px solid var(--stroke)}

/* Controlli */
.seg{display:flex;padding:4px;gap:4px;border-radius:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:700 14px var(--ui);padding:9px 0;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glass-hi);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:160px;scroll-snap-align:start;border:1px solid var(--stroke);padding:8px;text-align:left;color:var(--ink);cursor:pointer;font-family:var(--ui);
  display:flex;flex-direction:column;gap:8px;position:relative}
.card.chosen{outline:3px solid var(--accent);outline-offset:-1px}
.ph{width:100%;max-width:100%;aspect-ratio:1/1;border-radius:18px;display:grid;place-items:center;font-size:56px;background-size:cover;background-position:center}
.ph.big{border-radius:26px;font-size:110px}
.name{font-weight:800;font-size:15px;line-height:1.2;margin:0}
.brand{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin:0}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--glass-hi);border:1px solid var(--stroke);width:fit-content}
.badge{position:absolute;top:14px;right:14px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:12px;border-radius:99px;padding:4px 9px}

/* Sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(40,20,50,.25);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:500px;max-height:92vh;overflow-y:auto;border-radius:30px 30px 0 0;border-bottom:0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.72);animation:up .3s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.18);margin:0 auto}
.note{font-family:var(--hand);font-size:25px;line-height:1.25;margin:0;padding:14px 16px;border-radius:18px;background:var(--glass-hi)}
.links{display:flex;flex-direction:column;gap:8px}

/* Scelta */
.done{text-align:center;align-items:center}
.done .ph.big{width:230px}
.msg{padding:14px 16px;font-size:15px;line-height:1.45;white-space:pre-wrap;text-align:left;width:100%;user-select:all}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}

/* Tab bar */
.tabs{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;gap:4px;padding:6px;border-radius:30px;width:min(360px,calc(100% - 32px))}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font:800 11px var(--ui);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:6px 0;border-radius:24px}
.tabs button span{font-size:21px}
.tabs button[aria-current="page"]{background:var(--glass-hi);color:var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs glass" id="tabs">
  <button data-go="letter"><span>✉️</span>Lettera</button>
  <button data-go="shop"><span>✨</span>Desideri</button>
  <button data-go="choice"><span>🎁</span>La scelta</button>
</nav>
<div class="sheet-bg" id="sb" hidden><div class="sheet glass" id="sheet" role="dialog" aria-modal="true"></div></div>
<canvas id="conf" hidden></canvas>

const BUD=[[1,"Fino a 50 €","Piccoli pensieri"],[2,"50 – 300 €","Il giusto mezzo"],[3,"Oltre 300 €","Sogni grandi"]];
let st={screen:"letter",view:"cat",chosen:null};
try{const c=localStorage.getItem("lettera-scelta");if(c&&P.some(p=>p.id===c))st.chosen=c}catch(e){}
const app=document.getElementById("app"),tabs=document.getElementById("tabs"),sb=document.getElementById("sb"),sh=document.getElementById("sheet");
const byId=id=>P.find(p=>p.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ph=(p,big)=>`<div class="ph${big?" big":""}" style="${p.img?`background-image:url(${p.img})`:`background:${p.bg}`}">${p.img?"":p.ic}</div>`;
const budLabel=b=>BUD.find(x=>x[0]===b)[2];

function go(s){st.screen=s;render();scrollTo(0,0)}
function render(){
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===st.screen?"page":"false"));
  ({letter,shop,choice})[st.screen]();
}
function letter(){
  app.innerHTML=`<div class="screen">
    <div><p class="eyebrow">Natale 2026 · Polo Nord</p><h1>La letterina di Maura</h1></div>
    <article class="glass letter">
      <p class="hand h">Caro Babbo Natale,</p>
      <p class="hand">questo è quello che succede quando hai quasi 30 anni e sei una designer.</p>
      <p class="hand">Qui dentro trovi tutte le cose che a quest'età servono davvero, compreso il <b>botox al massetere per lo stress</b>. E ringrazia che la cura per la gastrite l'ho fatta a mie spese.</p>
      <p class="hand">Per questo ti chiedo una cosa sola: <b>portami gioia</b>.</p>
      <p class="hand">Ho scelto anche dei regali costosi, perché se non me li fai tu, chi me li fa? Ma ci sono budget per tutti, anche da 30 euro.</p>
      <p class="hand">E se questa lista non ti piace, scegli qualcosa che mi rappresenti, anche con un piccolo budget.</p>
      <p class="hand">Ti vorrò bene comunque.</p>
      <p class="hand sig">Maura ♡</p>
    </article>
    <button class="cta p" id="next">Guarda i desideri ✨</button></div>`;
  document.getElementById("next").onclick=()=>go("shop");
}
function cardHTML(p){return `<button class="card glass${st.chosen===p.id?" chosen":""}" data-id="${p.id}">${ph(p)}
  ${st.chosen===p.id?'<span class="badge">Scelto</span>':""}
  <span><p class="brand">${esc(p.brand)}</p><p class="name">${esc(p.name)}</p></span><span class="pill">${esc(p.price)}</span></button>`}
function shop(){
  const groups=st.view==="cat"?CATS.map(c=>[c,"",P.filter(p=>p.cat===c)]):BUD.map(([b,l,t])=>[t,l,P.filter(p=>p.b===b)]);
  app.innerHTML=`<div class="screen">
    <div><p class="eyebrow">${P.length} desideri</p><h1>Scegline uno</h1><p class="sub" style="margin-top:6px">Tocca un regalo, guardalo e premi "Scelgo questo".</p></div>
    <div class="seg glass" role="group" aria-label="Ordina per">
      <button data-v="cat" aria-pressed="${st.view==="cat"}">Categorie</button>
      <button data-v="bud" aria-pressed="${st.view==="bud"}">Budget</button></div>
    ${groups.filter(g=>g[2].length).map(([t,l,items])=>`<section class="section">
      <div class="sec-head"><h2>${esc(t)}</h2><span class="sub">${esc(l||items.length+(items.length>1?" idee":" idea"))}</span></div>
      <div class="rail">${items.map(cardHTML).join("")}</div></section>`).join("")}
  </div>`;
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{st.view=b.dataset.v;render()});
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>openSheet(b.dataset.id));
}
function openSheet(id){
  const p=byId(id),is=st.chosen===id;
  sh.innerHTML=`<div class="grab"></div>${ph(p,true)}
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><p class="brand">${esc(p.brand)} · ${esc(p.cat)}</p><h1 style="font-size:28px">${esc(p.name)}</h1></div>
      <span class="pill" style="margin-top:4px">${esc(p.price)}</span></div>
    <p class="sub">${esc(budLabel(p.b))}</p>
    <p class="note">${esc(p.n)}</p>
    <button class="cta p" id="pick">${is?"✓ È questo il regalo scelto":"Scelgo questo 🎁"}</button>
    ${p.links.length?`<div class="links">${p.links.map(l=>`<a class="cta s" href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join("")}</div>`:""}
    <button class="cta s" id="close">Chiudi</button>`;
  sb.hidden=false;
  document.getElementById("close").onclick=closeSheet;
  document.getElementById("pick").onclick=()=>{st.chosen=id;try{localStorage.setItem("lettera-scelta",id)}catch(e){}closeSheet();go("choice");confetti()};
}
function closeSheet(){sb.hidden=true}
sb.onclick=e=>{if(e.target===sb)closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function choice(){
  if(!st.chosen){app.innerHTML=`<div class="screen done">
    <div class="ph big glass" style="width:180px;margin-top:30px">🎁</div>
    <h1>Ancora nessuna scelta</h1><p class="sub">Sfoglia i desideri e scegline uno.</p>
    <button class="cta p" id="g">Vai ai desideri ✨</button></div>`;
    document.getElementById("g").onclick=()=>go("shop");return}
  const p=byId(st.chosen);
  const msg=`Cara Maura,\nho letto la tua letterina e ho scelto:\n🎁 ${p.brand} – ${p.name}${p.links[0]?"\n"+p.links[0][1]:""}\nBabbo Natale`;
  app.innerHTML=`<div class="screen done">
    <p class="eyebrow" style="margin-top:16px">La scelta di Babbo Natale</p>
    ${ph(p,true)}
    <div><p class="brand">${esc(p.brand)}</p><h1>${esc(p.name)}</h1></div>
    <p class="hand" style="font-size:30px;margin:0">Gioia consegnata ♡</p>
    <div class="msg glass" id="msg">${esc(msg)}</div>
    <button class="cta p" id="copy">Copia il messaggio per Maura</button>
    <button class="cta s" id="change">Cambia scelta</button></div>`;
  document.getElementById("copy").onclick=async e=>{try{await navigator.clipboard.writeText(msg);e.target.textContent="Copiato ✓ Ora incollalo in chat"}
    catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("msg"));getSelection().removeAllRanges();getSelection().addRange(r);e.target.textContent="Testo selezionato: copialo a mano"}};
  document.getElementById("change").onclick=()=>go("shop");
}
tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.go));
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("conf"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const cols=["#d6336c","#ffd3c4","#b9a6f2","#9fd0f0","#ffffff"];
  const ps=Array.from({length:130},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,vy:2+Math.random()*3,vx:-1+Math.random()*2,a:Math.random()*6,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
    if(++t<200)requestAnimationFrame(f);else c.hidden=true})();
}
render();
</script>
