<title>Lettera dei Desideri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: un iPhone sempre visibile al centro, su un paesaggio rosa sognante; dentro, un'app a bento in vetro smerigliato. Un solo look, valido in ogni tema. */
:root{
  --sky1:#f7d6dc; --sky2:#e9a9b6; --sky3:#c9a7e8; --sky4:#a9c4ee;
  --ink:#1f1b24; --muted:rgba(31,27,36,.55); --white:#ffffff;
  --glass:rgba(255,255,255,.34); --glass2:rgba(255,255,255,.6); --stroke:rgba(255,255,255,.65);
  --accent:#d24a73; --lemon:#f6f39a; --dark:#1e1e22;
  --ui:"Urbanist",-apple-system,"SF Pro Display",system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--ink);background:#eebcc6;overflow:hidden;
  background-image:radial-gradient(40% 35% at 20% 15%,#fff3f3,transparent 70%),radial-gradient(45% 40% at 85% 25%,var(--sky3),transparent 70%),
  radial-gradient(50% 45% at 15% 85%,var(--sky2),transparent 70%),radial-gradient(45% 45% at 90% 90%,var(--sky4),transparent 70%),
  linear-gradient(160deg,var(--sky1),#e8b3c0)}
.stage{height:100%;display:grid;place-items:center;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.orb{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff 0,#f6c3cf 25%,#e48ea3 60%,#c86a84 100%);opacity:.75}
.o1{width:260px;height:260px;left:6%;top:10%}.o2{width:180px;height:180px;right:8%;bottom:8%;opacity:.6}
.o3{width:90px;height:90px;right:22%;top:12%;opacity:.5}

/* Telefono */
.phone{position:relative;width:390px;height:812px;border-radius:58px;padding:12px;flex:none;
  background:linear-gradient(145deg,#f4f0f2,#cfc6cc);box-shadow:0 40px 80px -30px rgba(90,30,60,.55),inset 0 0 0 2px rgba(255,255,255,.8);transform-origin:center}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;
  background:linear-gradient(170deg,#a9b9e6 0%,#c8b7ea 35%,#f1c1d6 70%,#f7d9cf 100%)}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 30% at 80% 20%,rgba(255,255,255,.55),transparent 70%),radial-gradient(50% 30% at 10% 60%,rgba(255,200,220,.6),transparent 70%)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:50}
.status{position:absolute;top:0;left:0;right:0;height:58px;background:linear-gradient(#aab9e6 55%,rgba(170,185,230,0));display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0 44px;font-weight:700;font-size:16px;z-index:40}
.status .ic{display:flex;gap:6px;align-items:center}
.bat{width:26px;height:12px;border-radius:4px;border:1.5px solid var(--ink);padding:1.5px}.bat i{display:block;height:100%;width:80%;background:var(--ink);border-radius:2px}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.8;z-index:50}
.view{position:absolute;inset:0;overflow-y:auto;padding:62px 18px 130px;scrollbar-width:none;animation:in .35s ease-out}
.view::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Componenti */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--stroke)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--white);font-size:22px;cursor:pointer;border:1px solid var(--stroke);background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.star{font-size:62px;color:var(--white);line-height:1;font-weight:300}
.title{font-size:46px;font-weight:700;line-height:.98;letter-spacing:-.03em;color:var(--white);margin:14px 0 18px;text-shadow:0 0 18px rgba(255,255,255,.55);text-wrap:balance}
.title .soft{filter:blur(1.2px);opacity:.9}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:99px;padding:10px 18px;font:600 15px var(--ui);color:var(--ink);cursor:pointer;background:rgba(255,255,255,.28);border:1px solid var(--stroke)}
.chip[aria-pressed="true"]{background:var(--lemon);border-color:var(--lemon)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-auto-flow:dense}
.tile{border-radius:26px;overflow:hidden;position:relative;cursor:pointer;border:1px solid var(--stroke);padding:0;text-align:left;font-family:var(--ui);color:var(--ink);min-height:150px;display:block;width:100%}
.tile.tall{grid-row:span 2;min-height:312px}
.tile.wide{grid-column:span 2}
.tile .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.tile .emo{position:absolute;right:12px;top:10px;font-size:46px}
.tile .cap{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tile .nm{font-weight:800;font-size:17px;line-height:1.1;letter-spacing:-.01em}
.tile.photo .nm,.tile.photo .br{color:var(--white);text-shadow:0 1px 8px rgba(0,0,0,.35)}
.br{font-size:12px;font-weight:600;opacity:.75}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.55);border:1px solid var(--stroke);color:var(--ink);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tile.chosen{box-shadow:0 0 0 3px var(--accent)}
.flag{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
.letter-tile{background:rgba(255,255,255,.7);padding:18px}
.letter-tile .big{font-size:30px;font-weight:800;line-height:1;color:#4a6bb5;letter-spacing:-.02em}
.letter-tile .big span{filter:blur(1px);opacity:.75}
.letter-tile small{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--muted)}
.dark-tile{background:var(--dark);color:var(--white);padding:18px;min-height:120px}
.dark-tile .nm{color:var(--white);font-size:26px;font-weight:600}
.dark-tile .br{color:rgba(255,255,255,.55);font-size:16px;opacity:1}
.dark-tile .go{position:absolute;right:16px;bottom:14px;font-weight:600}

/* Pagina dettaglio */
.dtitle{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--white);text-align:center;margin:22px 0 16px;text-shadow:0 0 18px rgba(255,255,255,.6);text-wrap:balance}
.dtitle .soft{filter:blur(1.4px)}
.stack{position:relative;margin-top:22px}
.stack::before,.stack::after{content:"";position:absolute;left:24px;right:24px;top:-18px;height:40px;border-radius:22px;background:rgba(255,255,255,.55)}
.stack::after{left:12px;right:12px;top:-9px;background:#fbf7d8}
.paper{position:relative;z-index:1;background:var(--white);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px -24px rgba(60,30,80,.5)}
.paper .hd{display:flex;justify-content:space-between;align-items:flex-start}
.paper .hd b{font-size:16px}.paper .hd small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pen{width:36px;height:36px;border-radius:50%;background:#f3f1f5;display:grid;place-items:center;font-size:15px}
.lead{font-size:21px;font-weight:700;color:#4a6bb5;line-height:1.2;margin:0}
.body{font-size:15px;line-height:1.5;margin:0}
.hand{font-family:var(--hand);font-size:24px;line-height:1.25;margin:0}
.hand b{color:var(--accent)}
.sig{font-family:var(--hand);font-size:32px;text-align:right;color:var(--accent);margin:0}
.imgs{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}
.imgs div{aspect-ratio:1/1;max-width:100%;border-radius:18px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:56px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{font:700 13px var(--ui);text-decoration:none;color:var(--ink);background:#f3eef3;border-radius:99px;padding:9px 13px}

/* Barra azioni flottante */
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;z-index:45;display:flex;gap:8px;padding:7px;border-radius:99px;background:rgba(60,64,90,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.fab button{border:0;border-radius:99px;font:700 16px var(--ui);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.fab .main{background:var(--white);color:var(--ink);padding:14px 24px}
.fab .sec{background:rgba(255,255,255,.18);color:var(--white);padding:14px 18px}
.fab .main.on{background:var(--accent);color:#fff}
canvas#conf{position:absolute;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>

<div class="stage" id="stage">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="phone" id="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span class="ic">ᯤ <span class="bat"><i></i></span></span></div>
      <div id="view"></div>
      <div class="fab" id="fab"></div>
      <canvas id="conf" hidden></canvas>
      <div class="home-ind"></div>
    </div>
  </div>
</div>

<p class="hand">Qui dentro trovi tutte le cose che a quest'età servono davvero, compreso il <b>botox al massetere per lo stress</b>. E ringrazia che la cura per la gastrite l'ho fatta a mie spese.</p>
<p class="hand">Per questo ti chiedo una cosa sola: <b>portami gioia</b>.</p>
<p class="hand">Ho scelto anche dei regali costosi, perché se non me li fai tu, chi me li fa? Ma ci sono budget per tutti, anche da 30 euro.</p>
<p class="hand">E se questa lista non ti piace, scegli qualcosa che mi rappresenti, anche con un piccolo budget.</p>
<p class="hand">Ti vorrò bene comunque.</p><p class="sig">Maura ♡</p>`;
const FILTERS=[["all","Tutti"],["b1","Fino a 50 €"],["b2","50–300 €"],["b3","Sogni grandi"],...CATS.map(c=>["c:"+c,c])];
const SIZE={dyson:"tall",golden:"tall",pocket:"tall",vita1:"tall",vita2:"",ghd:"",sorpresa:"wide"};
let st={view:"home",f:"all",item:null,chosen:null};
try{const c=localStorage.getItem("lettera-scelta");if(c&&P.some(p=>p.id===c))st.chosen=c}catch(e){}
const V=document.getElementById("view"),FAB=document.getElementById("fab");
const byId=id=>P.find(p=>p.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bg=p=>p.img?`background-image:url(${p.img})`:`background:${p.bg}`;
const today=new Date().toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"});
function show(v,extra){Object.assign(st,{view:v},extra||{});render();V.scrollTop=0}
function render(){({home,letter,item,choice})[st.view]()}

function home(){
  const list=P.filter(p=>st.f==="all"||(st.f[0]==="b"&&p.b==+st.f[1])||(st.f.startsWith("c:")&&p.cat===st.f.slice(2)));
  V.innerHTML=`<div class="view">
    <div class="topbar"><span class="star">✳︎</span><button class="round" id="toChoice" aria-label="La scelta">🎁</button></div>
    <h1 class="title">I desideri <span class="soft">di Maura</span></h1>
    <div class="chips" role="group" aria-label="Filtri">${FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${st.f===k}">${esc(l)}</button>`).join("")}</div>
    <div class="bento">
      ${st.f==="all"?`<button class="tile letter-tile" id="openLetter"><div class="big">Caro<br>Babbo<br><span>Natale</span></div><small>${today}</small></button>`:""}
      ${list.map(p=>{const sz=SIZE[p.id]||"";return `<button class="tile ${sz} ${p.img?"photo":""} ${st.chosen===p.id?"chosen":""}" data-id="${p.id}">
        <div class="bg" style="${bg(p)}"></div>${p.img?"":`<span class="emo">${p.ic}</span>`}
        ${st.chosen===p.id?'<span class="flag">Scelto</span>':""}
        <div class="cap"><span class="br">${esc(p.brand)}</span><span class="nm">${esc(p.name)}</span><span class="pill">${esc(p.price)}</span></div></button>`}).join("")}
      ${st.f==="all"?`<button class="tile wide dark-tile" id="openLetter2"><div class="nm">La letterina</div><div class="br">di Maura · quasi 30 anni</div><span class="go">Leggi →</span></button>`:""}
    </div></div>`;
  V.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.f=b.dataset.f;home()});
  V.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>show("item",{item:b.dataset.id}));
  ["openLetter","openLetter2"].forEach(i=>{const e=document.getElementById(i);if(e)e.onclick=()=>show("letter")});
  document.getElementById("toChoice").onclick=()=>show("choice");
  FAB.innerHTML=`<button class="main" id="fl">✉︎ Leggi la lettera</button><button class="sec" id="fc" aria-label="La scelta">🎁</button>`;
  document.getElementById("fl").onclick=()=>show("letter");document.getElementById("fc").onclick=()=>show("choice");
}
function backBar(){return `<div class="topbar"><button class="round" id="back" aria-label="Indietro">‹</button><button class="round" id="more" aria-label="La scelta">⋯</button></div>`}
function wireBack(){document.getElementById("back").onclick=()=>show("home");document.getElementById("more").onclick=()=>show("choice")}
function letter(){
  V.innerHTML=`<div class="view">${backBar()}
    <h1 class="dtitle">Caro Babbo <span class="soft">Natale</span></h1>
    <div class="chips" style="justify-content:center"><span class="chip">Natale 2026</span><span class="chip">Polo Nord</span></div>
    <div class="stack"><div class="paper">
      <div class="hd"><div><b>Lettera di Maura</b><small>${today}</small></div><span class="pen">✎</span></div>
      <p class="lead">Portami gioia.</p>${LETTER}</div></div></div>`;
  wireBack();
  FAB.innerHTML=`<button class="main" id="fs">✨ Scegli un desiderio</button>`;
  document.getElementById("fs").onclick=()=>show("home");
}
function item(){
  const p=byId(st.item),is=st.chosen===p.id,w=p.name.split(" ");
  const other=P.filter(x=>x.cat===p.cat&&x.id!==p.id)[0];
  V.innerHTML=`<div class="view">${backBar()}
    <h1 class="dtitle">${esc(w.slice(0,-1).join(" ")||w[0])} <span class="soft">${w.length>1?esc(w[w.length-1]):""}</span></h1>
    <div class="chips" style="justify-content:center"><span class="chip">${esc(p.cat)}</span><span class="chip">${esc(p.price)}</span></div>
    <div class="stack"><div class="paper">
      <div class="hd"><div><b>${esc(p.brand)}</b><small>${esc(BUD.find(b=>b[0]===p.b)[2])}</small></div><span class="pen">♡</span></div>
      <p class="lead">${esc(p.name)}</p>
      <p class="hand">${esc(p.n)}</p>
      <div class="imgs"><div style="${bg(p)}">${p.img?"":p.ic}</div>${other?`<div style="${bg(other)};cursor:pointer" data-o="${other.id}" title="${esc(other.name)}">${other.img?"":other.ic}</div>`:`<div style="background:linear-gradient(135deg,#ffe3ec,#c9b7f0)">✨</div>`}</div>
      ${p.links.length?`<div class="links">${p.links.map(l=>`<a class="lnk" href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join("")}</div>`:""}
    </div></div></div>`;
  wireBack();
  const o=V.querySelector("[data-o]");if(o)o.onclick=()=>show("item",{item:o.dataset.o});
  FAB.innerHTML=`<button class="main ${is?"on":""}" id="pick">${is?"✓ Scelto":"＋ Scelgo questo"}</button>`;
  document.getElementById("pick").onclick=()=>{st.chosen=p.id;try{localStorage.setItem("lettera-scelta",p.id)}catch(e){}show("choice");confetti()};
}
function choice(){
  const p=st.chosen&&byId(st.chosen);
  if(!p){V.innerHTML=`<div class="view">${backBar()}<h1 class="dtitle">Nessuna <span class="soft">scelta</span></h1>
    <div class="stack"><div class="paper"><p class="lead">Ancora niente.</p><p class="body">Sfoglia i desideri e scegline uno: basta toccarlo e premere "Scelgo questo".</p></div></div></div>`;
    wireBack();FAB.innerHTML=`<button class="main" id="fs">✨ Vai ai desideri</button>`;document.getElementById("fs").onclick=()=>show("home");return}
  const msg=`Cara Maura,\nho letto la tua letterina e ho scelto:\n🎁 ${p.brand} – ${p.name}${p.links[0]?"\n"+p.links[0][1]:""}\nBabbo Natale`;
  V.innerHTML=`<div class="view">${backBar()}
    <h1 class="dtitle">Gioia <span class="soft">consegnata</span></h1>
    <div class="stack"><div class="paper">
      <div class="hd"><div><b>La scelta di Babbo Natale</b><small>${today}</small></div><span class="pen">🎁</span></div>
      <div class="imgs" style="grid-template-columns:1fr"><div style="${bg(p)};aspect-ratio:4/3">${p.img?"":p.ic}</div></div>
      <p class="lead">${esc(p.brand)} · ${esc(p.name)}</p>
      <p class="body" id="msg" style="white-space:pre-wrap;background:#f6f2f6;border-radius:16px;padding:12px;user-select:all">${esc(msg)}</p>
    </div></div></div>`;
  wireBack();
  FAB.innerHTML=`<button class="main" id="copy">Copia per Maura</button><button class="sec" id="chg">Cambia</button>`;
  document.getElementById("chg").onclick=()=>show("home");
  document.getElementById("copy").onclick=async e=>{const b=e.currentTarget;try{await navigator.clipboard.writeText(msg);b.textContent="Copiato ✓"}
    catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("msg"));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent="Selezionato"}};
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("conf"),x=c.getContext("2d");c.hidden=false;c.width=c.offsetWidth;c.height=c.offsetHeight;
  const cols=["#d24a73","#f6f39a","#c9a7e8","#a9c4ee","#ffffff"];
  const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,vy:2+Math.random()*3,vx:-1+Math.random()*2,a:Math.random()*6,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
    if(++t<200)requestAnimationFrame(f);else c.hidden=true})();
}
/* il telefono si adatta sempre allo schermo */
function fit(){const s=document.getElementById("stage"),ph=document.getElementById("phone");
  const k=Math.min(1,(s.clientWidth-24)/390,(s.clientHeight-24)/812);ph.style.zoom=k}
addEventListener("resize",fit);fit();
render();
</script>
